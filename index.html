<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To‑Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>To‑Do List</h1>
      </header>

      <section class="composer">
        <input
          id="task-input"
          type="text"
          placeholder="Add a new task"
          aria-label="Add a new task"
        />
        <button id="add-task" type="button">Add</button>
      </section>

      <section class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>

        <button id="clear-completed" type="button" class="secondary">
          Clear completed
        </button>
      </section>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <footer class="footer">
        <span id="items-left">0</span> items left
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
